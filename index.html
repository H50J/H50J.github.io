<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Liquid Glass — Spotify Controller</title>
  
  <!-- Spotify Logo Favicon -->
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" />
  <link rel="shortcut icon" href="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
    .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }

    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
    }

    .glass-button {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-button:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .glass-button:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.2);
    }

    @keyframes blob-float-1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.15); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }
    @keyframes blob-float-2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(-40px, 30px) scale(0.85); }
      66% { transform: translate(25px, -35px) scale(1.1); }
    }
    .animate-blob-1 { animation: blob-float-1 18s ease-in-out infinite; }
    .animate-blob-2 { animation: blob-float-2 22s ease-in-out infinite; }

    input[type="range"] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
      cursor: pointer;
      margin-top: -5px;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  </style>
</head>

<body class="bg-black text-white h-full w-full overflow-hidden font-sans fixed inset-0">

  <!-- Dynamic Background -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div id="blob1" class="absolute top-1/4 -left-20 w-96 h-96 rounded-full bg-emerald-600/30 blur-[100px] animate-blob-1 transition-colors duration-1000"></div>
    <div id="blob2" class="absolute bottom-1/4 -right-20 w-96 h-96 rounded-full bg-teal-600/30 blur-[100px] animate-blob-2 transition-colors duration-1000"></div>
    <div id="blob3" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] rounded-full bg-indigo-900/20 blur-[120px] transition-colors duration-1000"></div>
  </div>

  <canvas id="visualizer" class="fixed inset-0 w-full h-full pointer-events-none z-0 opacity-25"></canvas>
  <canvas id="color-canvas" class="hidden" width="50" height="50"></canvas>

  <!-- Main Container -->
  <main class="relative z-10 w-full h-full flex flex-col justify-between items-center px-4 pt-safe pb-safe max-w-md lg:max-w-4xl mx-auto lg:py-6">

    <!-- Header Navigation -->
    <header class="w-full flex items-center justify-between z-20 pt-2 lg:pt-0 mb-2">
      <button onclick="openModal('setup-modal')" class="glass-button px-3 py-1.5 rounded-full flex items-center gap-2 text-xs font-medium text-white/80 hover:text-white">
        <i class="ph-fill ph-spotify text-emerald-400 text-base"></i>
        <span id="connection-status">Not Connected</span>
        <span id="status-dot" class="w-2 h-2 rounded-full bg-rose-500"></span>
      </button>

      <div class="flex items-center gap-2">
        <button onclick="toggleDrawer('search-drawer')" class="glass-button p-2.5 rounded-full text-white/80 hover:text-white">
          <i class="ph ph-magnifying-glass text-lg"></i>
        </button>
        <button onclick="toggleDrawer('queue-drawer')" class="glass-button p-2.5 rounded-full text-white/80 hover:text-white">
          <i class="ph ph-queue text-lg"></i>
        </button>
        <button onclick="toggleDrawer('playlists-drawer')" class="glass-button p-2.5 rounded-full text-white/80 hover:text-white">
          <i class="ph ph-playlist text-lg"></i>
        </button>
      </div>
    </header>

    <!-- Main Content: Centered Album Art & Track Info -->
    <div class="w-full flex-1 flex flex-col items-center justify-center min-h-0 my-auto py-2">
      <section class="w-full flex flex-col items-center justify-center my-auto">
        <div class="relative group my-auto">
          <div id="album-glow" class="absolute inset-0 rounded-3xl bg-emerald-500/20 blur-2xl transition-all duration-700"></div>
          <div class="relative w-56 h-56 sm:w-72 sm:h-72 md:w-80 md:h-80 lg:w-96 lg:h-96 rounded-3xl overflow-hidden glass-panel p-2 transition-transform duration-300">
            <img id="track-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=600&auto=format&fit=crop&q=80" alt="Album Cover" class="w-full h-full object-cover rounded-2xl shadow-2xl" />
          </div>
        </div>

        <div class="text-center mt-4 sm:mt-6 w-full max-w-lg px-4">
          <h1 id="track-title" class="text-xl sm:text-2xl lg:text-3xl font-bold tracking-tight text-white truncate">Connect Spotify</h1>
          <p id="track-artist" class="text-xs sm:text-sm lg:text-base text-white/60 truncate mt-1">Tap the Spotify badge above to authorize</p>
        </div>

        <div class="w-full max-w-md mt-4 px-2">
          <input type="range" id="seek-bar" value="0" max="100" class="w-full" onchange="seekTrack(this.value)" />
          <div class="flex justify-between text-[10px] sm:text-xs text-white/50 mt-1 font-mono">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>
      </section>
    </div>

    <!-- Floating Control Island -->
    <footer class="w-full max-w-md lg:max-w-xl glass-panel rounded-3xl p-3 sm:p-4 mb-2 flex flex-col gap-3">
      <div class="flex items-center justify-between px-2">
        <button id="like-btn" onclick="toggleLike()" class="text-white/60 hover:text-rose-500 transition-colors">
          <i id="like-icon" class="ph ph-heart text-xl"></i>
        </button>

        <button id="shuffle-btn" onclick="cycleShuffle()" class="text-white/60 hover:text-white transition-colors relative">
          <i class="ph ph-shuffle text-xl"></i>
        </button>

        <button onclick="prevTrack()" class="text-white/80 hover:text-white transition-transform active:scale-90">
          <i class="ph-fill ph-skip-back text-2xl"></i>
        </button>

        <button onclick="togglePlay()" class="w-12 h-12 rounded-full bg-emerald-500 text-black flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/30 hover:scale-105 active:scale-95 transition-all">
          <i id="play-icon" class="ph-fill ph-play"></i>
        </button>

        <button onclick="nextTrack()" class="text-white/80 hover:text-white transition-transform active:scale-90">
          <i class="ph-fill ph-skip-forward text-2xl"></i>
        </button>

        <button id="repeat-btn" onclick="cycleRepeat()" class="text-white/60 hover:text-white transition-colors relative">
          <i id="repeat-icon" class="ph ph-repeat text-xl"></i>
          <span id="repeat-one-badge" class="hidden absolute -top-1 -right-2 text-[9px] bg-emerald-500 text-black font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center">1</span>
        </button>

        <button onclick="openModal('device-modal')" class="text-white/60 hover:text-white transition-colors">
          <i class="ph ph-devices text-xl"></i>
        </button>
      </div>

      <div class="flex items-center justify-center gap-3 px-4 pt-1 border-t border-white/10">
        <button id="mute-btn" onclick="toggleMute()" class="text-white/60 hover:text-white">
          <i id="mute-icon" class="ph ph-speaker-high text-lg"></i>
        </button>
        <input type="range" id="volume-bar" value="70" max="100" class="w-32 sm:w-48" oninput="setVolume(this.value)" />
      </div>
    </footer>

  </main>

  <!-- Modals & Drawers -->
  <div id="device-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden">
    <div class="glass-panel w-full max-w-sm rounded-3xl p-5 text-center">
      <h3 class="text-lg font-bold mb-3 flex items-center justify-center gap-2">
        <i class="ph ph-devices"></i> Connected Devices
      </h3>
      <div id="device-list" class="flex flex-col gap-2 my-4 max-h-48 overflow-y-auto"></div>
      <button onclick="closeModal('device-modal')" class="glass-button w-full py-2 rounded-xl text-sm font-medium">Close</button>
    </div>
  </div>

  <div id="setup-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden">
    <div class="glass-panel w-full max-w-md rounded-3xl p-6 text-left">
      <h3 class="text-xl font-bold mb-2 flex items-center gap-2">
        <i class="ph-fill ph-spotify text-emerald-400"></i> Spotify Integration
      </h3>
      <p class="text-xs text-white/70 mb-4 leading-relaxed">Connect your Spotify Premium account using your Client ID.</p>
      
      <label class="block text-xs font-semibold mb-1 text-white/80">Client ID</label>
      <input type="text" id="client-id-input" placeholder="Paste Client ID here..." class="w-full bg-white/10 border border-white/20 rounded-xl p-2.5 text-xs text-white mb-3 focus:outline-none focus:border-emerald-400" />

      <label class="block text-xs font-semibold mb-1 text-white/80">Redirect URI</label>
      <input type="text" id="redirect-uri-display" readonly class="w-full bg-white/5 border border-white/10 rounded-xl p-2.5 text-xs text-white/50 mb-4 font-mono select-all" />

      <div class="flex gap-2">
        <button onclick="startSpotifyLogin()" class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded-xl text-xs transition-colors">Connect / Reauthorize</button>
        <button onclick="closeModal('setup-modal')" class="glass-button px-4 py-2.5 rounded-xl text-xs">Cancel</button>
      </div>
    </div>
  </div>

  <div id="search-drawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-black/80 backdrop-blur-2xl z-40 p-6 flex flex-col transform translate-x-full transition-transform duration-300">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold flex items-center gap-2"><i class="ph ph-magnifying-glass"></i> Search Tracks</h2>
      <button onclick="toggleDrawer('search-drawer')" class="text-white/60 hover:text-white"><i class="ph ph-x text-xl"></i></button>
    </div>
    <input type="text" id="search-input" placeholder="Search song or artist..." class="w-full bg-white/10 border border-white/20 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-400 mb-3" onkeyup="handleSearch(event)" />
    <div id="search-history" class="mb-3 flex flex-wrap gap-1.5"></div>
    <div id="search-results" class="flex-1 overflow-y-auto flex flex-col gap-2"></div>
  </div>

  <div id="queue-drawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-black/80 backdrop-blur-2xl z-40 p-6 flex flex-col transform translate-x-full transition-transform duration-300">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold flex items-center gap-2"><i class="ph ph-queue"></i> Play Queue</h2>
      <button onclick="toggleDrawer('queue-drawer')" class="text-white/60 hover:text-white"><i class="ph ph-x text-xl"></i></button>
    </div>
    <div id="queue-list" class="flex-1 overflow-y-auto flex flex-col gap-2"></div>
  </div>

  <div id="playlists-drawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-black/80 backdrop-blur-2xl z-40 p-6 flex flex-col transform translate-x-full transition-transform duration-300">
    <div class="flex items-center justify-between mb-4">
      <div id="playlist-header-left" class="flex items-center gap-2">
        <h2 class="text-lg font-bold flex items-center gap-2"><i class="ph ph-playlist"></i> Your Playlists</h2>
      </div>
      <button onclick="toggleDrawer('playlists-drawer')" class="text-white/60 hover:text-white"><i class="ph ph-x text-xl"></i></button>
    </div>

    <div id="playlists-list" class="flex-1 overflow-y-auto flex flex-col gap-2">
      <p class="text-xs text-white/50 text-center py-4">Loading playlists...</p>
    </div>

    <div id="playlist-detail" class="hidden flex-1 flex-col overflow-hidden">
      <div class="flex items-center gap-3 bg-white/5 p-3 rounded-2xl mb-3">
        <img id="playlist-detail-img" src="" class="w-14 h-14 rounded-xl object-cover" />
        <div class="overflow-hidden flex-1">
          <h3 id="playlist-detail-title" class="text-sm font-bold text-white truncate">Playlist Title</h3>
          <p id="playlist-detail-subtitle" class="text-[10px] text-white/60 truncate">0 Tracks</p>
          <div class="flex items-center gap-2 mt-2">
            <button id="playlist-play-btn" class="px-3 py-1 bg-emerald-500 text-black font-bold text-xs rounded-full flex items-center gap-1 hover:bg-emerald-400">
              <i class="ph-fill ph-play text-xs"></i> Play
            </button>
            <button id="playlist-shuffle-btn" class="px-3 py-1 glass-button text-white font-bold text-xs rounded-full flex items-center gap-1">
              <i class="ph ph-shuffle text-xs"></i> Shuffle
            </button>
          </div>
        </div>
      </div>
      <div id="playlist-tracks-list" class="flex-1 overflow-y-auto flex flex-col gap-2 pr-1"></div>
    </div>
  </div>

  <script>
    let isPlaying = false;
    let isMuted = false;
    let isCurrentTrackLiked = false;
    let currentTrackId = null;
    let activeDeviceId = null;
    let prevVolume = 70;
    let shuffleState = false; 
    let repeatState = 0;
    let currentProgressMs = 0;
    let trackDurationMs = 0;
    let accessToken = localStorage.getItem('spotify_access_token') || null;
    let searchHistory = JSON.parse(localStorage.getItem('search_history') || '[]');

    const currentOrigin = window.location.origin + window.location.pathname;
    document.getElementById('redirect-uri-display').value = currentOrigin;

    // Visualizer Canvas
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawVisualizer() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const bars = 32;
      const width = canvas.width / bars;
      for (let i = 0; i < bars; i++) {
        const height = isPlaying ? Math.random() * (canvas.height * 0.18) + 15 : 4;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.fillRect(i * width * 1.5, canvas.height - height, width, height);
      }
      requestAnimationFrame(drawVisualizer);
    }
    drawVisualizer();

    function openModal(id) { 
      document.getElementById(id).classList.remove('hidden'); 
      if (id === 'device-modal') fetchDevices();
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function toggleDrawer(id) {
      const drawer = document.getElementById(id);
      drawer.classList.toggle('translate-x-full');
      if (!drawer.classList.contains('translate-x-full')) {
        if (id === 'queue-drawer') fetchQueue();
        if (id === 'playlists-drawer') { showPlaylistsList(); fetchPlaylists(); }
        if (id === 'search-drawer') renderSearchHistory();
      }
    }

    function extractColorAndApply(imgUrl) {
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.src = imgUrl;
      img.onload = () => {
        const cCanvas = document.getElementById('color-canvas');
        const cCtx = cCanvas.getContext('2d');
        cCtx.drawImage(img, 0, 0, 50, 50);
        const data = cCtx.getImageData(10, 10, 30, 30).data;
        const r = data[0], g = data[1], b = data[2];
        document.getElementById('blob1').style.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.35)`;
        document.getElementById('blob2').style.backgroundColor = `rgba(${g}, ${b}, ${r}, 0.25)`;
        document.getElementById('album-glow').style.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.3)`;
      };
    }

    function getDeviceParam() {
      return activeDeviceId ? `?device_id=${encodeURIComponent(activeDeviceId)}` : '';
    }

    // Playback Controls
    function togglePlay() {
      if (!accessToken) return openModal('setup-modal');
      const endpoint = isPlaying ? 'pause' : 'play';
      fetch(`https://api.spotify.com/v1/me/player/${endpoint}${getDeviceParam()}`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${accessToken}` }
      }).then(() => setTimeout(fetchPlaybackState, 300));
    }

    function updatePlayStateUI(playing) {
      isPlaying = playing;
      document.getElementById('play-icon').className = isPlaying ? 'ph-fill ph-pause' : 'ph-fill ph-play';
    }

    function toggleMute() {
      const volBar = document.getElementById('volume-bar');
      const muteIcon = document.getElementById('mute-icon');
      if (!isMuted) {
        prevVolume = volBar.value;
        volBar.value = 0;
        isMuted = true;
        muteIcon.className = 'ph ph-speaker-x text-lg text-rose-400';
      } else {
        volBar.value = prevVolume;
        isMuted = false;
        muteIcon.className = 'ph ph-speaker-high text-lg';
      }
      setVolume(volBar.value);
    }

    function setVolume(val) {
      if (accessToken) {
        fetch(`https://api.spotify.com/v1/me/player/volume?volume_percent=${val}${activeDeviceId ? '&device_id=' + activeDeviceId : ''}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${accessToken}` }
        });
      }
    }

    function seekTrack(percent) {
      if (accessToken && trackDurationMs) {
        const targetMs = Math.floor((percent / 100) * trackDurationMs);
        fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${targetMs}${activeDeviceId ? '&device_id=' + activeDeviceId : ''}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${accessToken}` }
        });
      }
    }

    // LIKED TRACK CHECK
    async function checkIsTrackLiked(trackId) {
      if (!accessToken || !trackId) return;
      try {
        const res = await fetch(`https://api.spotify.com/v1/me/library/contains?uris=${encodeURIComponent(`spotify:track:${trackId}`)}`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (!res.ok) throw new Error(`Library check failed: ${res.status}`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          isCurrentTrackLiked = Boolean(data[0]);
          updateLikeUI(isCurrentTrackLiked);
        }
      } catch (error) {
        console.error('Could not check liked state:', error);
      }
    }

    async function toggleLike() {
      if (!accessToken) return openModal('setup-modal');
      if (!currentTrackId) return;

      const uri = `spotify:track:${currentTrackId}`;
      const method = isCurrentTrackLiked ? 'DELETE' : 'PUT';
      const button = document.getElementById('like-btn');
      button.disabled = true;

      try {
        const res = await fetch(`https://api.spotify.com/v1/me/library?uris=${encodeURIComponent(uri)}`, {
          method,
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (!res.ok) {
          const errorText = await res.text();
          console.error('Like request failed:', res.status, errorText);
          alert(`Spotify could not ${isCurrentTrackLiked ? 'remove this song from' : 'save this song to'} your library (${res.status}).`);
          return;
        }

        isCurrentTrackLiked = !isCurrentTrackLiked;
        updateLikeUI(isCurrentTrackLiked);
      } catch (error) {
        console.error('Like request error:', error);
      } finally {
        button.disabled = false;
      }
    }

    function updateLikeUI(liked) {
      const icon = document.getElementById('like-icon');
      const btn = document.getElementById('like-btn');
      if (liked) {
        icon.className = 'ph-fill ph-heart text-xl text-rose-500';
        btn.className = 'text-rose-500 transition-colors';
      } else {
        icon.className = 'ph ph-heart text-xl';
        btn.className = 'text-white/60 hover:text-rose-500 transition-colors';
      }
    }

    async function cycleShuffle() {
      if (!accessToken) return openModal('setup-modal');
      const nextState = !shuffleState;
      const deviceParam = activeDeviceId ? `&device_id=${encodeURIComponent(activeDeviceId)}` : '';

      try {
        const res = await fetch(`https://api.spotify.com/v1/me/player/shuffle?state=${nextState}${deviceParam}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (!res.ok) throw new Error(`Shuffle request failed: ${res.status}`);
        updateShuffleUI(nextState);
      } catch (error) {
        console.error('Shuffle error:', error);
      }
    }

    function updateShuffleUI(state) {
      shuffleState = state;
      const btn = document.getElementById('shuffle-btn');
      if (state) {
        btn.className = 'text-emerald-400 transition-colors relative';
      } else {
        btn.className = 'text-white/60 hover:text-white transition-colors relative';
      }
    }

    function cycleRepeat() {
      if (!accessToken) return openModal('setup-modal');
      repeatState = (repeatState + 1) % 3;
      updateRepeatUI(repeatState);

      const modes = ['off', 'context', 'track'];
      const deviceParam = activeDeviceId ? `&device_id=${activeDeviceId}` : '';
      fetch(`https://api.spotify.com/v1/me/player/repeat?state=${modes[repeatState]}${deviceParam}`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${accessToken}` }
      });
    }

    function updateRepeatUI(state) {
      repeatState = state;
      const btn = document.getElementById('repeat-btn');
      const icon = document.getElementById('repeat-icon');
      const badge = document.getElementById('repeat-one-badge');

      if (state === 0) {
        btn.className = 'text-white/60 hover:text-white transition-colors relative';
        icon.className = 'ph ph-repeat text-xl';
        badge.classList.add('hidden');
      } else if (state === 1) {
        btn.className = 'text-emerald-400 transition-colors relative';
        icon.className = 'ph ph-repeat text-xl';
        badge.classList.add('hidden');
      } else {
        btn.className = 'text-emerald-400 transition-colors relative';
        icon.className = 'ph ph-repeat-once text-xl';
        badge.classList.remove('hidden');
      }
    }

    function nextTrack() {
      if (!accessToken) return openModal('setup-modal');
      fetch(`https://api.spotify.com/v1/me/player/next${getDeviceParam()}`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${accessToken}` }
      }).then(() => setTimeout(fetchPlaybackState, 300));
    }

    function prevTrack() {
      if (!accessToken) return openModal('setup-modal');
      fetch(`https://api.spotify.com/v1/me/player/previous${getDeviceParam()}`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${accessToken}` }
      }).then(() => setTimeout(fetchPlaybackState, 300));
    }

    async function refreshActiveDevice() {
      if (!accessToken) return null;
      try {
        const res = await fetch('https://api.spotify.com/v1/me/player', {
          headers: { Authorization: `Bearer ${accessToken}` },
          cache: 'no-store'
        });
        if (!res.ok) return null;
        const data = await res.json();
        if (data?.device?.id && data.device.is_active !== false) {
          activeDeviceId = data.device.id;
          return data.device;
        }
      } catch (error) {
        console.error('Active device refresh error:', error);
      }
      return null;
    }

    // QUEUE-SAFE TRACK PLAYBACK
    async function playTrackUri(uri) {
      if (!accessToken) return openModal('setup-modal');
      if (!uri) return;

      try {
        const current = await refreshActiveDevice();
        const deviceParam = current?.id ? `?device_id=${encodeURIComponent(current.id)}` : '';

        // Add track to queue first, then skip to next
        const queueRes = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(uri)}${current?.id ? '&device_id=' + encodeURIComponent(current.id) : ''}`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (queueRes.ok) {
          await fetch(`https://api.spotify.com/v1/me/player/next${deviceParam}`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${accessToken}` }
          });
        } else {
          // Direct play fallback if session supports it
          await fetch(`https://api.spotify.com/v1/me/player/play${deviceParam}`, {
            method: 'PUT',
            headers: {
              Authorization: `Bearer ${accessToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ uris: [uri] })
          });
        }

        setTimeout(fetchPlaybackState, 700);
      } catch (error) {
        console.error('Playback error:', error);
      }
    }

    async function playContextUri(contextUri, offsetPosition = 0) {
      if (!accessToken) return openModal('setup-modal');
      if (!contextUri) return;

      try {
        const current = await refreshActiveDevice();
        const playUrl = current?.id
          ? `https://api.spotify.com/v1/me/player/play?device_id=${encodeURIComponent(current.id)}`
          : 'https://api.spotify.com/v1/me/player/play';
        const res = await fetch(playUrl, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            context_uri: contextUri,
            offset: { position: offsetPosition }
          })
        });

        if (!res.ok) {
          const errorText = await res.text();
          console.error('Context playback failed:', res.status, errorText);
          alert(`Spotify could not start this playlist (${res.status}).`);
          return;
        }
        setTimeout(fetchPlaybackState, 500);
      } catch (error) {
        console.error('Context playback error:', error);
      }
    }

    async function shuffleContextUri(contextUri) {
      if (!accessToken) return openModal('setup-modal');
      if (!contextUri) return;

      try {
        await refreshActiveDevice();
        const deviceParam = activeDeviceId ? `&device_id=${encodeURIComponent(activeDeviceId)}` : '';
        const shuffleRes = await fetch(`https://api.spotify.com/v1/me/player/shuffle?state=true${deviceParam}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (!shuffleRes.ok) throw new Error(`Shuffle request failed: ${shuffleRes.status}`);
        updateShuffleUI(true);
        await playContextUri(contextUri, 0);
      } catch (error) {
        console.error('Shuffle playback error:', error);
      }
    }

    function formatMs(ms) {
      const sec = Math.floor((ms / 1000) % 60);
      const min = Math.floor(ms / 60000);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function fetchPlaybackState() {
      if (!accessToken) return;
      fetch('https://api.spotify.com/v1/me/player', {
        headers: { Authorization: `Bearer ${accessToken}` }
      })
      .then(res => res.status === 200 ? res.json() : null)
      .then(data => {
        if (!data || !data.item) {
          fetchDevices();
          return;
        }

        if (data.device && data.device.id) {
          activeDeviceId = data.device.id;
        }

        updatePlayStateUI(data.is_playing);
        
        if (data.repeat_state) {
          const rMode = data.repeat_state;
          updateRepeatUI(rMode === 'track' ? 2 : (rMode === 'context' ? 1 : 0));
        }

        if (data.shuffle_state !== undefined) {
          updateShuffleUI(data.shuffle_state);
        }

        if (currentTrackId !== data.item.id) {
          currentTrackId = data.item.id;
          checkIsTrackLiked(currentTrackId);
        }

        document.getElementById('track-title').textContent = data.item.name;
        document.getElementById('track-artist').textContent = data.item.artists.map(a => a.name).join(', ');
        
        const artUrl = data.item.album.images[0]?.url;
        if (artUrl && document.getElementById('track-art').src !== artUrl) {
          document.getElementById('track-art').src = artUrl;
          extractColorAndApply(artUrl);
        }

        currentProgressMs = data.progress_ms;
        trackDurationMs = data.item.duration_ms;
        document.getElementById('seek-bar').value = (currentProgressMs / trackDurationMs) * 100;
        document.getElementById('time-current').textContent = formatMs(currentProgressMs);
        document.getElementById('time-total').textContent = formatMs(trackDurationMs);
      });
    }

    function fetchDevices() {
      const list = document.getElementById('device-list');
      if (!accessToken) {
        list.innerHTML = '<p class="text-xs text-white/50">Please connect Spotify first.</p>';
        return;
      }
      fetch('https://api.spotify.com/v1/me/player/devices', {
        headers: { Authorization: `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(data => {
        if (!data.devices?.length) {
          list.innerHTML = '<p class="text-xs text-white/50">No active Spotify devices found. Open Spotify on any phone, PC, or tablet.</p>';
          return;
        }

        const activeDev = data.devices.find(d => d.is_active) || data.devices[0];
        if (activeDev) activeDeviceId = activeDev.id;

        list.innerHTML = data.devices.map(d => `
          <button onclick="transferPlayback('${d.id}')" class="glass-button w-full p-3 rounded-xl flex items-center justify-between text-xs text-left">
            <div>
              <p class="font-bold text-white">${d.name}</p>
              <p class="text-[10px] text-white/50 capitalize">${d.type}</p>
            </div>
            ${d.is_active ? '<span class="text-emerald-400 font-bold text-[10px]">ACTIVE</span>' : ''}
          </button>
        `).join('');
      });
    }

    function transferPlayback(deviceId) {
      activeDeviceId = deviceId;
      fetch('https://api.spotify.com/v1/me/player', {
        method: 'PUT',
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_ids: [deviceId], play: true })
      }).then(() => {
        closeModal('device-modal');
        setTimeout(fetchPlaybackState, 400);
      });
    }

    function fetchQueue() {
      const list = document.getElementById('queue-list');
      if (!accessToken) return;

      fetch('https://api.spotify.com/v1/me/player/queue', {
        headers: { Authorization: `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(data => {
        if (!data.queue?.length) return;
        list.innerHTML = data.queue.slice(0, 15).map(t => `
          <div onclick="playTrackUri('${t.uri}')" class="glass-button p-2.5 rounded-2xl flex items-center gap-3 cursor-pointer hover:border-emerald-500/50 transition-colors">
            <img src="${t.album.images[2]?.url || t.album.images[0]?.url || ''}" class="w-10 h-10 rounded-xl object-cover" />
            <div class="overflow-hidden">
              <p class="text-xs font-bold text-white truncate">${t.name}</p>
              <p class="text-[10px] text-white/60 truncate">${t.artists.map(a => a.name).join(', ')}</p>
            </div>
          </div>
        `).join('');
      });
    }

    function showPlaylistsList() {
      document.getElementById('playlists-list').classList.remove('hidden');
      document.getElementById('playlist-detail').classList.add('hidden');
      document.getElementById('playlist-header-left').innerHTML = '<h2 class="text-lg font-bold flex items-center gap-2"><i class="ph ph-playlist"></i> Your Playlists</h2>';
    }

    async function fetchPlaylists() {
      const list = document.getElementById('playlists-list');
      if (!accessToken) {
        list.innerHTML = '<p class="text-xs text-white/50 text-center py-4">Connect Spotify to view your playlists.</p>';
        return;
      }

      list.innerHTML = '<p class="text-xs text-white/50 text-center py-4">Loading playlists...</p>';

      try {
        const items = [];
        let url = 'https://api.spotify.com/v1/me/playlists?limit=50';

        while (url) {
          const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
          if (!res.ok) throw new Error(`Playlist request failed: ${res.status}`);
          const data = await res.json();
          items.push(...(data.items || []));
          url = data.next || null;
        }

        if (!items.length) {
          list.innerHTML = '<p class="text-xs text-white/50 text-center py-4">No playlists found.</p>';
          return;
        }

        list.innerHTML = items.map(p => {
          const imgUrl = p.images?.[0]?.url || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&auto=format&fit=crop&q=80';
          const trackCount = p.items?.total ?? p.tracks?.total ?? 0;
          return `
            <div onclick="openPlaylistDetail('${p.id}', '${encodeURIComponent(p.name)}', '${encodeURIComponent(imgUrl)}', '${p.uri}', ${trackCount})" class="glass-button p-2.5 rounded-2xl flex items-center gap-3 cursor-pointer hover:border-emerald-500/50 transition-colors">
              <img src="${imgUrl}" class="w-10 h-10 rounded-xl object-cover" />
              <div class="overflow-hidden">
                <p class="text-xs font-bold text-white truncate">${p.name}</p>
                <p class="text-[10px] text-white/60 truncate">${trackCount} Tracks</p>
              </div>
            </div>
          `;
        }).join('');
      } catch (error) {
        console.error('Playlist loading error:', error);
        list.innerHTML = '<p class="text-xs text-rose-400 text-center py-4">Could not load playlists. Check your Spotify permissions.</p>';
      }
    }

    async function openPlaylistDetail(playlistId, nameEnc, imgUrlEnc, playlistUri, trackCount) {
      const name = decodeURIComponent(nameEnc);
      const imgUrl = decodeURIComponent(imgUrlEnc);

      document.getElementById('playlists-list').classList.add('hidden');
      document.getElementById('playlist-detail').classList.remove('hidden');
      document.getElementById('playlist-detail').classList.add('flex');

      document.getElementById('playlist-header-left').innerHTML = `
        <button onclick="showPlaylistsList()" class="glass-button p-1.5 rounded-full text-white/80 hover:text-white flex items-center justify-center">
          <i class="ph ph-arrow-left text-base"></i>
        </button>
        <h2 class="text-sm font-bold text-white truncate max-w-[200px]">${name}</h2>
      `;

      document.getElementById('playlist-detail-img').src = imgUrl;
      document.getElementById('playlist-detail-title').textContent = name;
      document.getElementById('playlist-detail-subtitle').textContent = `${trackCount} Tracks`;
      document.getElementById('playlist-play-btn').onclick = () => playContextUri(playlistUri, 0);
      document.getElementById('playlist-shuffle-btn').onclick = () => shuffleContextUri(playlistUri);

      const tracksList = document.getElementById('playlist-tracks-list');
      tracksList.innerHTML = '<p class="text-xs text-white/50 text-center py-4">Loading all tracks...</p>';

      try {
        const allItems = [];
        let url = `https://api.spotify.com/v1/playlists/${playlistId}/items?limit=50`;

        while (url) {
          const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
          if (!res.ok) {
            const message = res.status === 403
              ? 'Spotify only allows this playlist to be read if you own it or collaborate on it.'
              : `Spotify returned ${res.status} while loading this playlist.`;
            throw new Error(message);
          }
          const data = await res.json();
          allItems.push(...(data.items || []));
          url = data.next || null;
        }

        const tracks = allItems
          .map(item => item.item || item.track)
          .filter(t => t && t.type === 'track' && t.uri);

        if (!tracks.length) {
          tracksList.innerHTML = '<p class="text-xs text-white/50 text-center py-4">No playable tracks in this playlist.</p>';
          return;
        }

        tracksList.innerHTML = tracks.map((t, idx) => `
          <div onclick="playContextUri('${playlistUri}', ${idx})" class="glass-button p-2.5 rounded-2xl flex items-center gap-3 cursor-pointer hover:border-emerald-500/50 transition-colors">
            <span class="text-xs text-white/40 font-mono w-5 text-center">${idx + 1}</span>
            <img src="${t.album?.images?.[2]?.url || t.album?.images?.[0]?.url || imgUrl}" class="w-9 h-9 rounded-lg object-cover" />
            <div class="overflow-hidden flex-1">
              <p class="text-xs font-bold text-white truncate">${t.name}</p>
              <p class="text-[10px] text-white/60 truncate">${t.artists?.map(a => a.name).join(', ') || ''}</p>
            </div>
            <span class="text-[10px] text-white/40 font-mono">${formatMs(t.duration_ms || 0)}</span>
          </div>
        `).join('');
      } catch (error) {
        console.error('Playlist track loading error:', error);
        tracksList.innerHTML = `<p class="text-xs text-rose-400 text-center py-4 px-4">${error.message || 'Failed to load tracks.'}</p>`;
      }
    }

    function renderSearchHistory() {
      const container = document.getElementById('search-history');
      container.innerHTML = searchHistory.map(q => `
        <button onclick="executeSearch('${q}')" class="glass-button px-2.5 py-1 rounded-full text-[10px] text-white/70 hover:text-white">${q}</button>
      `).join('');
    }

    function handleSearch(e) {
      if (e.key === 'Enter') {
        const query = e.target.value.trim();
        if (query) executeSearch(query);
      }
    }

    async function executeSearch(query) {
      document.getElementById('search-input').value = query;
      if (!searchHistory.includes(query)) {
        searchHistory.unshift(query);
        if (searchHistory.length > 5) searchHistory.pop();
        localStorage.setItem('search_history', JSON.stringify(searchHistory));
        renderSearchHistory();
      }
      if (!accessToken) return openModal('setup-modal');

      const results = document.getElementById('search-results');
      results.innerHTML = '<p class="text-xs text-white/50 text-center py-4">Searching Spotify...</p>';

      try {
        const response = await fetch(
          `https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=10`,
          {
            headers: { Authorization: `Bearer ${accessToken}` },
            cache: 'no-store'
          }
        );

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`Spotify search failed (${response.status}): ${errorText}`);
        }

        const data = await response.json();
        const tracks = data.tracks?.items || [];

        if (!tracks.length) {
          results.innerHTML = '<p class="text-xs text-white/50 text-center py-4">No songs found.</p>';
          return;
        }

        results.innerHTML = tracks.map(t => `
          <div onclick="playTrackUri('${t.uri}')" class="glass-button p-2.5 rounded-2xl flex items-center gap-3 cursor-pointer hover:border-emerald-500/50 transition-colors">
            <img src="${t.album?.images?.[2]?.url || t.album?.images?.[0]?.url || ''}" class="w-10 h-10 rounded-xl object-cover" />
            <div class="overflow-hidden flex-1">
              <p class="text-xs font-bold text-white truncate">${t.name}</p>
              <p class="text-[10px] text-white/60 truncate">${t.artists?.map(a => a.name).join(', ') || ''}</p>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Search error:', error);
        results.innerHTML = '<p class="text-xs text-rose-400 text-center py-4">Spotify search failed. Please try again.</p>';
      }
    }

    // Spotify PKCE Auth Setup
    async function startSpotifyLogin() {
      const clientIdInput = document.getElementById('client-id-input').value.trim();
      const clientId = clientIdInput || localStorage.getItem('spotify_client_id');
      if (!clientId) return alert('Please enter a valid Client ID');

      const verifier = generateRandomString(128);
      const challenge = await generateCodeChallenge(verifier);
      
      localStorage.setItem('spotify_client_id', clientId);
      localStorage.setItem('code_verifier', verifier);

      const scopes = 'user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative user-library-read user-library-modify';

      const params = new URLSearchParams({
        client_id: clientId,
        response_type: 'code',
        redirect_uri: currentOrigin,
        scope: scopes,
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    function generateRandomString(length) {
      let text = '';
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
      return text;
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // Process Auth Code
    const urlParams = new URLSearchParams(window.location.search);
    const authCode = urlParams.get('code');
    if (authCode) {
      const clientId = localStorage.getItem('spotify_client_id');
      const verifier = localStorage.getItem('code_verifier');

      fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: clientId,
          grant_type: 'authorization_code',
          code: authCode,
          redirect_uri: currentOrigin,
          code_verifier: verifier
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.access_token) {
          localStorage.setItem('spotify_access_token', data.access_token);
          window.history.replaceState({}, document.title, window.location.pathname);
          location.reload();
        }
      });
    }

    // Init
    if (accessToken) {
      document.getElementById('connection-status').textContent = 'Connected';
      document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-emerald-400';
      setInterval(fetchPlaybackState, 2000);
      setInterval(fetchQueue, 5000);
      fetchDevices();
      fetchPlaybackState();
      fetchQueue();
    } else {
      openModal('setup-modal');
    }

    const storedClientId = localStorage.getItem('spotify_client_id');
    if (storedClientId) {
      document.getElementById('client-id-input').value = storedClientId;
    }

    extractColorAndApply(document.getElementById('track-art').src);
  </script>
