<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Liquid Glass — Spotify Web Player</title>
  
  <!-- Spotify Logo Favicon -->
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" />
  <link rel="shortcut icon" href="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
    .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }

    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
    }

    .glass-button {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-button:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.18);
    }

    @keyframes blob-float-1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.15); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }
    @keyframes blob-float-2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(-40px, 30px) scale(0.85); }
      66% { transform: translate(25px, -35px) scale(1.1); }
    }
    .animate-blob-1 { animation: blob-float-1 18s ease-in-out infinite; }
    .animate-blob-2 { animation: blob-float-2 22s ease-in-out infinite; }

    input[type="range"] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
      cursor: pointer;
      margin-top: -5px;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  </style>
</head>

<body class="bg-black text-white h-full w-full overflow-hidden font-sans fixed inset-0">

  <!-- Audio Element for Demo Mode -->
  <audio id="demo-audio" crossorigin="anonymous" src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"></audio>

  <!-- Dynamic Liquid Background -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div id="blob1" class="absolute top-1/4 -left-20 w-96 h-96 rounded-full bg-emerald-600/30 blur-[100px] animate-blob-1 transition-colors duration-1000"></div>
    <div id="blob2" class="absolute bottom-1/4 -right-20 w-96 h-96 rounded-full bg-teal-600/30 blur-[100px] animate-blob-2 transition-colors duration-1000"></div>
    <div id="blob3" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] rounded-full bg-indigo-900/20 blur-[120px] transition-colors duration-1000"></div>
  </div>

  <canvas id="visualizer" class="fixed inset-0 w-full h-full pointer-events-none z-0 opacity-25"></canvas>
  <canvas id="color-canvas" class="hidden" width="50" height="50"></canvas>

  <!-- Full-Screen Container -->
  <main class="relative z-10 w-full h-full flex flex-col justify-between items-center px-4 pt-safe pb-safe max-w-2xl mx-auto">

    <!-- Header Controls -->
    <header class="w-full flex items-center justify-between z-20 pt-2">
      <button onclick="openModal('setup-modal')" class="glass-button px-3 py-1.5 rounded-full flex items-center gap-2 text-xs font-medium text-white/80 hover:text-white">
        <i class="ph-fill ph-spotify text-emerald-400 text-base"></i>
        <span id="connection-status">Demo Mode</span>
        <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
      </button>

      <div class="flex items-center gap-2">
        <button onclick="toggleDrawer('search-drawer')" class="glass-button p-2.5 rounded-full text-white/80 hover:text-white">
          <i class="ph ph-magnifying-glass text-lg"></i>
        </button>
        <button onclick="toggleDrawer('queue-drawer')" class="glass-button p-2.5 rounded-full text-white/80 hover:text-white">
          <i class="ph ph-queue text-lg"></i>
        </button>
        <button onclick="toggleDrawer('playlists-drawer')" class="glass-button p-2.5 rounded-full text-white/80 hover:text-white">
          <i class="ph ph-playlist text-lg"></i>
        </button>
      </div>
    </header>

    <!-- Center Player -->
    <section class="w-full flex-1 flex flex-col items-center justify-center my-auto min-h-0 py-2">
      <div class="relative group my-auto">
        <div id="album-glow" class="absolute inset-0 rounded-3xl bg-emerald-500/20 blur-2xl transition-all duration-700"></div>
        <div class="relative w-48 h-48 sm:w-64 sm:h-64 md:w-72 md:h-72 rounded-3xl overflow-hidden glass-panel p-2 transition-transform duration-300">
          <img id="track-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=600&auto=format&fit=crop&q=80" alt="Album Cover" class="w-full h-full object-cover rounded-2xl shadow-2xl" />
        </div>
      </div>

      <div class="text-center mt-4 sm:mt-6 w-full px-4">
        <h1 id="track-title" class="text-xl sm:text-2xl font-bold tracking-tight text-white truncate">Lofi Study Stream</h1>
        <p id="track-artist" class="text-xs sm:text-sm text-white/60 truncate mt-1">Liquid Glass Player</p>
      </div>

      <div class="w-full max-w-md mt-4 px-2">
        <input type="range" id="seek-bar" value="0" max="100" class="w-full" onchange="seekTrack(this.value)" />
        <div class="flex justify-between text-[10px] sm:text-xs text-white/50 mt-1 font-mono">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>
    </section>

    <!-- Control Island -->
    <footer class="w-full max-w-md glass-panel rounded-3xl p-3 sm:p-4 mb-2 flex flex-col gap-3">
      <div class="flex items-center justify-between px-2">
        <button id="like-btn" onclick="toggleLike()" class="text-white/60 hover:text-rose-500 transition-colors">
          <i class="ph ph-heart text-xl"></i>
        </button>

        <button id="shuffle-btn" onclick="cycleShuffle()" class="text-white/60 hover:text-white transition-colors relative">
          <i class="ph ph-shuffle text-xl"></i>
          <span id="smart-shuffle-badge" class="hidden absolute -top-1 -right-2 text-[9px] bg-emerald-500 text-black font-bold px-1 rounded-full">✨</span>
        </button>

        <button onclick="prevTrack()" class="text-white/80 hover:text-white transition-transform active:scale-90">
          <i class="ph-fill ph-skip-back text-2xl"></i>
        </button>

        <button onclick="togglePlay()" class="w-12 h-12 rounded-full bg-emerald-500 text-black flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/30 hover:scale-105 active:scale-95 transition-all">
          <i id="play-icon" class="ph-fill ph-play"></i>
        </button>

        <button onclick="nextTrack()" class="text-white/80 hover:text-white transition-transform active:scale-90">
          <i class="ph-fill ph-skip-forward text-2xl"></i>
        </button>

        <button id="repeat-btn" onclick="cycleRepeat()" class="text-white/60 hover:text-white transition-colors">
          <i class="ph ph-repeat text-xl"></i>
        </button>

        <button onclick="openModal('device-modal')" class="text-white/60 hover:text-white transition-colors">
          <i class="ph ph-devices text-xl"></i>
        </button>
      </div>

      <div class="flex items-center justify-center gap-3 px-4 pt-1 border-t border-white/10">
        <button id="mute-btn" onclick="toggleMute()" class="text-white/60 hover:text-white">
          <i id="mute-icon" class="ph ph-speaker-high text-lg"></i>
        </button>
        <input type="range" id="volume-bar" value="70" max="100" class="w-32 sm:w-48" oninput="setVolume(this.value)" />
      </div>
    </footer>
  </main>

  <!-- Modals & Drawers -->
  <div id="device-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden">
    <div class="glass-panel w-full max-w-sm rounded-3xl p-5 text-center">
      <h3 class="text-lg font-bold mb-3 flex items-center justify-center gap-2">
        <i class="ph ph-devices"></i> Connected Devices
      </h3>
      <div id="device-list" class="flex flex-col gap-2 my-4 max-h-48 overflow-y-auto"></div>
      <button onclick="closeModal('device-modal')" class="glass-button w-full py-2 rounded-xl text-sm font-medium">Close</button>
    </div>
  </div>

  <div id="setup-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden">
    <div class="glass-panel w-full max-w-md rounded-3xl p-6 text-left">
      <h3 class="text-xl font-bold mb-2 flex items-center gap-2">
        <i class="ph-fill ph-spotify text-emerald-400"></i> Spotify Integration
      </h3>
      <p class="text-xs text-white/70 mb-4 leading-relaxed">
        Connect your Spotify Premium account using your Client ID.
      </p>
      
      <label class="block text-xs font-semibold mb-1 text-white/80">Client ID</label>
      <input type="text" id="client-id-input" placeholder="Paste Client ID here..." class="w-full bg-white/10 border border-white/20 rounded-xl p-2.5 text-xs text-white mb-3 focus:outline-none focus:border-emerald-400" />

      <label class="block text-xs font-semibold mb-1 text-white/80">Redirect URI</label>
      <input type="text" id="redirect-uri-display" readonly class="w-full bg-white/5 border border-white/10 rounded-xl p-2.5 text-xs text-white/50 mb-4 font-mono select-all" />

      <div class="flex gap-2">
        <button onclick="startSpotifyLogin()" class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded-xl text-xs transition-colors">Connect</button>
        <button onclick="closeModal('setup-modal')" class="glass-button px-4 py-2.5 rounded-xl text-xs">Cancel</button>
      </div>
    </div>
  </div>

  <div id="search-drawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-black/80 backdrop-blur-2xl z-40 p-6 flex flex-col transform translate-x-full transition-transform duration-300">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold flex items-center gap-2"><i class="ph ph-magnifying-glass"></i> Search Tracks</h2>
      <button onclick="toggleDrawer('search-drawer')" class="text-white/60 hover:text-white"><i class="ph ph-x text-xl"></i></button>
    </div>
    <input type="text" id="search-input" placeholder="Search song or artist..." class="w-full bg-white/10 border border-white/20 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-400 mb-3" onkeyup="handleSearch(event)" />
    <div id="search-history" class="mb-3 flex flex-wrap gap-1.5"></div>
    <div id="search-results" class="flex-1 overflow-y-auto flex flex-col gap-2"></div>
  </div>

  <div id="queue-drawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-black/80 backdrop-blur-2xl z-40 p-6 flex flex-col transform translate-x-full transition-transform duration-300">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold flex items-center gap-2"><i class="ph ph-queue"></i> Play Queue</h2>
      <button onclick="toggleDrawer('queue-drawer')" class="text-white/60 hover:text-white"><i class="ph ph-x text-xl"></i></button>
    </div>
    <div id="queue-list" class="flex-1 overflow-y-auto flex flex-col gap-2"></div>
  </div>

  <div id="playlists-drawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-black/80 backdrop-blur-2xl z-40 p-6 flex flex-col transform translate-x-full transition-transform duration-300">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold flex items-center gap-2"><i class="ph ph-playlist"></i> Your Playlists</h2>
      <button onclick="toggleDrawer('playlists-drawer')" class="text-white/60 hover:text-white"><i class="ph ph-x text-xl"></i></button>
    </div>
    <div id="playlists-list" class="flex-1 overflow-y-auto flex flex-col gap-2"></div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    let isPlaying = false;
    let isMuted = false;
    let prevVolume = 70;
    let shuffleState = 0;
    let repeatState = 0;
    let currentProgressMs = 0;
    let trackDurationMs = 0;
    let accessToken = localStorage.getItem('spotify_access_token') || null;
    let searchHistory = JSON.parse(localStorage.getItem('search_history') || '[]');

    const demoAudio = document.getElementById('demo-audio');
    const currentOrigin = window.location.origin + window.location.pathname;
    document.getElementById('redirect-uri-display').value = currentOrigin;

    // Visualizer Canvas
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawVisualizer() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const bars = 32;
      const width = canvas.width / bars;
      for (let i = 0; i < bars; i++) {
        const height = isPlaying ? Math.random() * (canvas.height * 0.18) + 15 : 8;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.fillRect(i * width * 1.5, canvas.height - height, width, height);
      }
      requestAnimationFrame(drawVisualizer);
    }
    drawVisualizer();

    // UI Helpers
    function openModal(id) { 
      document.getElementById(id).classList.remove('hidden'); 
      if (id === 'device-modal') fetchDevices();
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function toggleDrawer(id) {
      const drawer = document.getElementById(id);
      drawer.classList.toggle('translate-x-full');
      if (!drawer.classList.contains('translate-x-full')) {
        if (id === 'queue-drawer') fetchQueue();
        if (id === 'playlists-drawer') fetchPlaylists();
        if (id === 'search-drawer') renderSearchHistory();
      }
    }

    // Dynamic Artwork Colors
    function extractColorAndApply(imgUrl) {
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.src = imgUrl;
      img.onload = () => {
        const cCanvas = document.getElementById('color-canvas');
        const cCtx = cCanvas.getContext('2d');
        cCtx.drawImage(img, 0, 0, 50, 50);
        const data = cCtx.getImageData(10, 10, 30, 30).data;
        const r = data[0], g = data[1], b = data[2];
        document.getElementById('blob1').style.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.35)`;
        document.getElementById('blob2').style.backgroundColor = `rgba(${g}, ${b}, ${r}, 0.25)`;
        document.getElementById('album-glow').style.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.3)`;
      };
    }

    // Playback Controls
    function togglePlay() {
      if (accessToken) {
        const endpoint = isPlaying ? 'pause' : 'play';
        fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${accessToken}` }
        }).then(() => fetchPlaybackState());
      } else {
        isPlaying = !isPlaying;
        if (isPlaying) demoAudio.play(); else demoAudio.pause();
        updatePlayStateUI(isPlaying);
      }
    }

    function updatePlayStateUI(playing) {
      isPlaying = playing;
      document.getElementById('play-icon').className = isPlaying ? 'ph-fill ph-pause' : 'ph-fill ph-play';
    }

    function toggleMute() {
      const volBar = document.getElementById('volume-bar');
      const muteIcon = document.getElementById('mute-icon');
      if (!isMuted) {
        prevVolume = volBar.value;
        volBar.value = 0;
        isMuted = true;
        muteIcon.className = 'ph ph-speaker-x text-lg text-rose-400';
      } else {
        volBar.value = prevVolume;
        isMuted = false;
        muteIcon.className = 'ph ph-speaker-high text-lg';
      }
      setVolume(volBar.value);
    }

    function setVolume(val) {
      if (accessToken) {
        fetch(`https://api.spotify.com/v1/me/player/volume?volume_percent=${val}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${accessToken}` }
        });
      } else {
        demoAudio.volume = val / 100;
      }
    }

    function seekTrack(percent) {
      if (accessToken && trackDurationMs) {
        const targetMs = Math.floor((percent / 100) * trackDurationMs);
        fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${targetMs}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${accessToken}` }
        });
      } else if (!accessToken) {
        demoAudio.currentTime = (percent / 100) * (demoAudio.duration || 100);
      }
    }

    function cycleShuffle() {
      shuffleState = (shuffleState + 1) % 3;
      const btn = document.getElementById('shuffle-btn');
      const badge = document.getElementById('smart-shuffle-badge');
      if (shuffleState === 0) {
        btn.className = 'text-white/60 hover:text-white transition-colors relative';
        badge.classList.add('hidden');
      } else if (shuffleState === 1) {
        btn.className = 'text-emerald-400 transition-colors relative';
        badge.classList.add('hidden');
      } else {
        btn.className = 'text-emerald-400 transition-colors relative';
        badge.classList.remove('hidden');
      }
      if (accessToken) {
        fetch(`https://api.spotify.com/v1/me/player/shuffle?state=${shuffleState > 0}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${accessToken}` }
        });
      }
    }

    function cycleRepeat() {
      repeatState = (repeatState + 1) % 3;
      const modes = ['off', 'context', 'track'];
      document.getElementById('repeat-btn').className = repeatState === 0 ? 'text-white/60 hover:text-white' : 'text-emerald-400';
      if (accessToken) {
        fetch(`https://api.spotify.com/v1/me/player/repeat?state=${modes[repeatState]}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${accessToken}` }
        });
      }
    }

    function toggleLike() {
      document.getElementById('like-btn').classList.toggle('text-rose-500');
    }

    function nextTrack() {
      if (accessToken) {
        fetch('https://api.spotify.com/v1/me/player/next', {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}` }
        }).then(() => setTimeout(fetchPlaybackState, 300));
      }
    }

    function prevTrack() {
      if (accessToken) {
        fetch('https://api.spotify.com/v1/me/player/previous', {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}` }
        }).then(() => setTimeout(fetchPlaybackState, 300));
      }
    }

    function playTrackUri(uri) {
      if (accessToken) {
        fetch('https://api.spotify.com/v1/me/player/play', {
          method: 'PUT',
          headers: { 
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ uris: [uri] })
        }).then(() => setTimeout(fetchPlaybackState, 400));
      } else {
        togglePlay();
      }
    }

    function playContextUri(contextUri) {
      if (accessToken) {
        fetch('https://api.spotify.com/v1/me/player/play', {
          method: 'PUT',
          headers: { 
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ context_uri: contextUri })
        }).then(() => setTimeout(fetchPlaybackState, 400));
      }
    }

    // Formatting Time
    function formatMs(ms) {
      const sec = Math.floor((ms / 1000) % 60);
      const min = Math.floor(ms / 60000);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Spotify Player Sync
    function fetchPlaybackState() {
      if (!accessToken) return;
      fetch('https://api.spotify.com/v1/me/player', {
        headers: { Authorization: `Bearer ${accessToken}` }
      })
      .then(res => res.status === 200 ? res.json() : null)
      .then(data => {
        if (!data || !data.item) return;
        updatePlayStateUI(data.is_playing);
        document.getElementById('track-title').textContent = data.item.name;
        document.getElementById('track-artist').textContent = data.item.artists.map(a => a.name).join(', ');
        
        const artUrl = data.item.album.images[0]?.url;
        if (artUrl && document.getElementById('track-art').src !== artUrl) {
          document.getElementById('track-art').src = artUrl;
          extractColorAndApply(artUrl);
        }

        currentProgressMs = data.progress_ms;
        trackDurationMs = data.item.duration_ms;
        document.getElementById('seek-bar').value = (currentProgressMs / trackDurationMs) * 100;
        document.getElementById('time-current').textContent = formatMs(currentProgressMs);
        document.getElementById('time-total').textContent = formatMs(trackDurationMs);
      });
    }

    // Devices, Queue, Search, Playlists
    function fetchDevices() {
      const list = document.getElementById('device-list');
      if (!accessToken) {
        list.innerHTML = '<div class="glass-panel p-3 rounded-xl text-xs text-emerald-400 font-medium">Demo Web Player (Active)</div>';
        return;
      }
      fetch('https://api.spotify.com/v1/me/player/devices', {
        headers: { Authorization: `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(data => {
        if (!data.devices?.length) {
          list.innerHTML = '<p class="text-xs text-white/50">No active Spotify devices found.</p>';
          return;
        }
        list.innerHTML = data.devices.map(d => `
          <button onclick="transferPlayback('${d.id}')" class="glass-button w-full p-3 rounded-xl flex items-center justify-between text-xs text-left">
            <div>
              <p class="font-bold text-white">${d.name}</p>
              <p class="text-[10px] text-white/50 capitalize">${d.type}</p>
            </div>
            ${d.is_active ? '<span class="text-emerald-400 font-bold text-[10px]">ACTIVE</span>' : ''}
          </button>
        `).join('');
      });
    }

    function transferPlayback(deviceId) {
      fetch('https://api.spotify.com/v1/me/player', {
        method: 'PUT',
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_ids: [deviceId], play: true })
      }).then(() => closeModal('device-modal'));
    }

    function fetchQueue() {
      const list = document.getElementById('queue-list');
      if (!accessToken) {
        list.innerHTML = '<p class="text-xs text-white/50 text-center py-4">Connect Spotify to view live play queue.</p>';
        return;
      }
      fetch('https://api.spotify.com/v1/me/player/queue', {
        headers: { Authorization: `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(data => {
        if (!data.queue?.length) return list.innerHTML = '<p class="text-xs text-white/50">Queue is empty.</p>';
        list.innerHTML = data.queue.slice(0, 15).map(t => `
          <div onclick="playTrackUri('${t.uri}')" class="glass-button p-2.5 rounded-2xl flex items-center gap-3 cursor-pointer">
            <img src="${t.album.images[2]?.url || ''}" class="w-10 h-10 rounded-xl object-cover" />
            <div class="overflow-hidden">
              <p class="text-xs font-bold text-white truncate">${t.name}</p>
              <p class="text-[10px] text-white/60 truncate">${t.artists.map(a => a.name).join(', ')}</p>
            </div>
          </div>
        `).join('');
      });
    }

    function fetchPlaylists() {
      const list = document.getElementById('playlists-list');
      if (!accessToken) {
        list.innerHTML = '<p class="text-xs text-white/50 text-center py-4">Connect Spotify to view your playlists.</p>';
        return;
      }
      fetch('https://api.spotify.com/v1/me/playlists', {
        headers: { Authorization: `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(data => {
        if (!data.items?.length) return list.innerHTML = '<p class="text-xs text-white/50">No playlists found.</p>';
        list.innerHTML = data.items.map(p => `
          <div onclick="playContextUri('${p.uri}')" class="glass-button p-2.5 rounded-2xl flex items-center gap-3 cursor-pointer">
            <img src="${p.images[0]?.url || ''}" class="w-10 h-10 rounded-xl object-cover" />
            <div class="overflow-hidden">
              <p class="text-xs font-bold text-white truncate">${p.name}</p>
              <p class="text-[10px] text-white/60 truncate">${p.tracks.total} Tracks</p>
            </div>
          </div>
        `).join('');
      });
    }

    function renderSearchHistory() {
      const container = document.getElementById('search-history');
      container.innerHTML = searchHistory.map(q => `
        <button onclick="executeSearch('${q}')" class="glass-button px-2.5 py-1 rounded-full text-[10px] text-white/70 hover:text-white">${q}</button>
      `).join('');
    }

    function handleSearch(e) {
      if (e.key === 'Enter') {
        const query = e.target.value.trim();
        if (query) executeSearch(query);
      }
    }

    function executeSearch(query) {
      document.getElementById('search-input').value = query;
      if (!searchHistory.includes(query)) {
        searchHistory.unshift(query);
        if (searchHistory.length > 5) searchHistory.pop();
        localStorage.setItem('search_history', JSON.stringify(searchHistory));
        renderSearchHistory();
      }
      if (!accessToken) return;
      fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=10`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(data => {
        const results = document.getElementById('search-results');
        results.innerHTML = data.tracks.items.map(t => `
          <div onclick="playTrackUri('${t.uri}')" class="glass-button p-2.5 rounded-2xl flex items-center gap-3 cursor-pointer">
            <img src="${t.album.images[2]?.url || ''}" class="w-10 h-10 rounded-xl object-cover" />
            <div class="overflow-hidden">
              <p class="text-xs font-bold text-white truncate">${t.name}</p>
              <p class="text-[10px] text-white/60 truncate">${t.artists.map(a => a.name).join(', ')}</p>
            </div>
          </div>
        `).join('');
      });
    }

    // Spotify OAuth PKCE Flow
    async function startSpotifyLogin() {
      const clientId = document.getElementById('client-id-input').value.trim();
      if (!clientId) return alert('Please enter a valid Client ID');

      const verifier = generateRandomString(128);
      const challenge = await generateCodeChallenge(verifier);
      
      localStorage.setItem('spotify_client_id', clientId);
      localStorage.setItem('code_verifier', verifier);

      const params = new URLSearchParams({
        client_id: clientId,
        response_type: 'code',
        redirect_uri: currentOrigin,
        scope: 'user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private',
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    function generateRandomString(length) {
      let text = '';
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
      return text;
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // Process Auth Redirect Token
    const urlParams = new URLSearchParams(window.location.search);
    const authCode = urlParams.get('code');
    if (authCode) {
      const clientId = localStorage.getItem('spotify_client_id');
      const verifier = localStorage.getItem('code_verifier');

      fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: clientId,
          grant_type: 'authorization_code',
          code: authCode,
          redirect_uri: currentOrigin,
          code_verifier: verifier
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.access_token) {
          localStorage.setItem('spotify_access_token', data.access_token);
          window.history.replaceState({}, document.title, window.location.pathname);
          location.reload();
        }
      });
    }

    // Initialization & Event Loops
    if (accessToken) {
      document.getElementById('connection-status').textContent = 'Connected';
      document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-emerald-400';
      setInterval(fetchPlaybackState, 2000);
      fetchPlaybackState();
    } else {
      demoAudio.addEventListener('timeupdate', () => {
        if (demoAudio.duration) {
          document.getElementById('seek-bar').value = (demoAudio.currentTime / demoAudio.duration) * 100;
          document.getElementById('time-current').textContent = formatMs(demoAudio.currentTime * 1000);
          document.getElementById('time-total').textContent = formatMs(demoAudio.duration * 1000);
        }
      });
    }

    extractColorAndApply(document.getElementById('track-art').src);
  </script>
</body>
